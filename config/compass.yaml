  - {signal: "出现“写代码 vs 点屏幕”的受控对比（盯 [openai-cua-sample-app](https://github.com/openai/openai-cua-sample-app/commits/main)、[Anthropic 文档](https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-reference)）", action: "调整 M6 比重"}
  - {signal: "个人 agent 使用量明显回落或被平台大面积封堵（参考 [Amazon 封堵 Muse](https://www.thestar.com.my/tech/tech-news/2026/09/22/amazon-blocks-metas-muse-ai-agent-from-its-retail-site)，二手）", action: "主线偏向 M9 工作场景"}
  - {signal: "Meta 等公开记忆或主动性的训练方法或基准（盯 [Muse Wonder](https://research.meta.ai/blog/muse-wonder)）", action: "对齐定义，避免重复造轮子"}
  - {signal: "新模型在多周个人任务上大幅提升（盯 [VibeLifeBench 主页](https://vibebench.github.io/VibeLifeBench_homepage/)）", action: "练习场加难：更长时间、更多服务、多设备"}

