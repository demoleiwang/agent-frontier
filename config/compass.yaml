modules_intro: "大目标拆成 10 个模块，按阶段一个个完成：第 1–4 周跑通最小闭环（M1、M2、M3、M5），第 5–10 周补齐练习场（M4、M6），第 9–12 周基线评测（M7），第 12–20 周训练（M8），第 20–26 周扩展与发布（M9）。依据见 [proposal §2–§3](https://github.com/demoleiwang/agent-frontier/blob/claude/inspiring-lovelace-umqw6v/reviews/2026-10-14_research-proposal.md)。"

