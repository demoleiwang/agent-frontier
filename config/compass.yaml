directions:
  - name: agent 自主安排时间（自设闹钟、无提示开工）
    status: 空白
    keywords: [self-scheduling, wake-up, heartbeat, cron, always-on, persistent agent, background agent, ambient agent, unprompted, scheduled task, routine, long-running agent]
    why: "产品卖点是“不用提示就开工”（[Grok Bot](https://x.ai/news/designing-grok-bot)、[Autopilot](https://blogs.microsoft.com/blog/2026/09/25/introducing-the-new-copilot-with-home-code-and-autopilot/)），各家实现都是定时加事件再由模型判断（[nanoMuse triggers](https://github.com/nano-muse/nanoMuse/blob/2ab584c/nanomuse/triggers/store.py)、[Grok routines](https://docs.x.ai/grok-bot/skills-routines-and-automations)）；开源环境里 agent 只在剧本时间点被叫醒（[VibeLifeBench task.py](https://github.com/evolvent-ai/VibeLifeBench/blob/cd21b2cb5d18a81b0fcdb4a948889a2148f48958/eval_set/travel/galapagos_no_us_transit/task.py#L471-L492)）。"
    evidence:
      - {title: "VibeLifeBench · 剧本式唤醒", url: "https://github.com/evolvent-ai/VibeLifeBench/blob/cd21b2cb5d18a81b0fcdb4a948889a2148f48958/eval_set/travel/galapagos_no_us_transit/task.py#L471-L492"}
      - {title: "xAI · Designing Grok Bot", url: "https://x.ai/news/designing-grok-bot"}
    next: M3 时钟与事件引擎

  - name: 主动性与打扰时机
    status: 空白
    keywords: [proactive, proactivity, proactive agent, interruption, intervention timing, notification, check-in, unsolicited, anticipat]
    why: "时机不对的打扰会让信任骤降，用户偏好它在自己不用电脑时干活（[Proactivity-Gym](https://arxiv.org/abs/2609.37267)，细节为[二手](https://hyper.ai/en/papers/2609.37267)）；选择性提醒优于一直提醒（[Proactive Memory Agent](https://arxiv.org/abs/2607.08716)）；GPT-5.1 在日程场景只有 26.7% 反应得当（[ProEvent](https://arxiv.org/abs/2607.17701)）；没有一家公开“何时打扰”的评测（[nanoMuse roadmap](https://github.com/nano-muse/nanoMuse/blob/2ab584c/docs/roadmap.md)）。"
    evidence:
      - {title: "Proactivity-Gym", url: "https://arxiv.org/abs/2609.37267"}
      - {title: "Proactive Memory Agent (Meta)", url: "https://arxiv.org/abs/2607.08716"}
    next: M4 用户模拟器 + M5 打扰质量判分

  - name: 主动记忆（该想起时想起、别编造）
    status: 上升
    keywords: [long-term memory, agent memory, memory agent, memory consolidation, personalization, user profile, preference, recall, forgetting]
    why: "放在眼前 84.0%，靠检索最高 14.4%（[InMind](https://arxiv.org/abs/2607.24368)）；12 个模型编造用户特征 35–49%（[Mirage](https://arxiv.org/abs/2608.04570)）；Meta 把 Active Memory 当训练目标（[Muse Wonder](https://research.meta.ai/blog/muse-wonder)）；记忆整理已是后台作业（[Grok Build memory](https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/13-memory.md)）。"
    evidence:
      - {title: "InMind", url: "https://arxiv.org/abs/2607.24368"}
      - {title: "Personalization Mirage", url: "https://arxiv.org/abs/2608.04570"}
      - {title: "Grok Build memory", url: "https://github.com/xai-org/grok-build/blob/main/crates/codegen/xai-grok-pager/docs/user-guide/13-memory.md"}
    next: M2 数字人里埋“隐藏关联”，M5 判分

  - name: 数字人与个人数据合成
    status: 上升
    keywords: [persona, user simulation, digital life, life log, lifelog, synthetic user, synthetic persona, mobile experiences, personal data, digital twin]
    why: "已有可照搬流程：人设 → 一年事件 → 各应用记录（[MobileMem](https://github.com/zjunlp/MobileMem/blob/fa5cd13c9c659699df9caf650987ba2bea8ca085/text/README.md)）、真实地图天气约束（[SenWorld](https://arxiv.org/abs/2607.19949)）；真人数据极少：8 人、83 人、1 人（[MobileMem-Omni](https://github.com/zjunlp/MobileMem/blob/fa5cd13c9c659699df9caf650987ba2bea8ca085/omni/README.md)、[Fingertip20k](https://github.com/fyzhang1/ExpActivator/blob/3ef8ce5d923de56e56dc17eada833306dd92ea63/samples/user_profile.csv)、[Activity Frames](https://github.com/nossa-y/activity-frames/blob/a2ce997ef45e9c865d632b8ac601080a758d29d8/research/RESULTS.md)）。"
    evidence:
      - {title: "MobileMem", url: "https://github.com/zjunlp/MobileMem/blob/fa5cd13c9c659699df9caf650987ba2bea8ca085/text/README.md"}
      - {title: "SenWorld", url: "https://arxiv.org/abs/2607.19949"}
    next: M2 数字人生成器

  - name: 用户模拟器
    status: 上升
    keywords: [user simulator, user simulation, simulated user, user proxy, persona-conditioned, role-play user]
    why: "只换模拟用户分数就差 15.2（[UserProxyBench](https://arxiv.org/abs/2609.38043)）；训练出的模拟用户比 GPT-5.5 扮演更好（[MIMESIS](https://github.com/VietHoang1512/mimesis/blob/main/README.md)）；代理交易 85% 的差距来自误读偏好（[Project Swap](https://www.anthropic.com/research/project-swap)）。"
    evidence:
      - {title: "MIMESIS", url: "https://github.com/VietHoang1512/mimesis/blob/main/README.md"}
      - {title: "UserProxyBench", url: "https://arxiv.org/abs/2609.38043"}
    next: M4

  - name: 写代码操作电脑 vs 点屏幕
    status: 上升
    keywords: [code as action, code-as-action, CodeAct, Playwright, PyAutoGUI, programmatic tool calling, GUI and CLI, GUI+CLI, hybrid action space, semantic actions, REPL]
    why: "OpenAI 删掉点鼠标接口只留写代码（[commit a0f5a76](https://github.com/openai/openai-cua-sample-app/commit/a0f5a7641df9fbe76968ca41245a5eceee6061ce)），Anthropic 不让代码点屏幕（[tool reference](https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-reference)）；学术证据：结构化语义动作 >80 分对截图点击 6.6/26.6（[ASIL](https://arxiv.org/abs/2608.26991)），只换接口差 30% 以上（[ComponentBench](https://arxiv.org/abs/2608.18307)），不训练直接给命令行掉分（[HybridCUA](https://github.com/ZJU-REAL/HybridCUA/blob/main/README.md)）。"
    evidence:
      - {title: "openai-cua-sample-app", url: "https://github.com/openai/openai-cua-sample-app/blob/main/README.md"}
      - {title: "ASIL", url: "https://arxiv.org/abs/2608.26991"}
      - {title: "HybridCUA", url: "https://arxiv.org/abs/2609.38008"}
    next: M6 动手层的成对对比

  - name: 多周长任务与计划修订
    status: 上升
    keywords: [multi-day, multi-week, living world, plan revision, goal tracking, weeks-long, days-long]
    why: "最强模型多周个人任务 32.5 分，越往后掉 10–15 分（[VibeLifeBench](https://vibebench.github.io/VibeLifeBench_homepage/)，二手）；Grok 4.7 训练偏向数小时任务（[Grok 4.7](https://x.ai/news/grok-4-7)）；Opus 5.5 连续独立工作 18 小时以上（[Anthropic](https://www.anthropic.com/claude-opus-5-5)）；多周个人环境里训练只有 Kimi 自述（[K3](https://github.com/MoonshotAI/Kimi-K3/blob/main/k3_tech_report.pdf)）。"
    evidence:
      - {title: "VibeLifeBench", url: "https://github.com/evolvent-ai/VibeLifeBench"}
      - {title: "Kimi K3 §4.2.5", url: "https://github.com/MoonshotAI/Kimi-K3/blob/main/k3_tech_report.pdf"}
    next: M5 任务 + M8 训练

  - name: 办公与专业任务（领域引擎判分）
    status: 上升
    keywords: [professional software, engineering software, scientific software, CAD, spreadsheet, Excel, contract, enterprise workflow, ERP, CRM, finance agent, legal agent, medical agent]
    why: "专业任务仍低分：DAYJOB 最强 24.7%（[DAYJOB](https://arxiv.org/abs/2610.01306)），CADWorld 17.5% 对专家 87.0%（[CADWorld](https://arxiv.org/abs/2609.16251)）；有领域判分时强化学习提升明显（[NeutronGym](https://arxiv.org/abs/2610.03631)）；Muse 已推出小生意版（[Muse for Small Business](https://about.fb.com/news/2026/09/introducing-muse-small-business/)）。"
    evidence:
      - {title: "DAYJOB", url: "https://arxiv.org/abs/2610.01306"}
      - {title: "EngiWorld", url: "https://github.com/Hongcheng-Gao/EngiWorld/blob/main/README.md"}
    next: M9

