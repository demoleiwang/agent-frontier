# topic 定义。匹配范围：title（权重高）+ 源自带 tags + 正文前若干字符。
# keywords 大小写不敏感；短词（<=4 字符）按整词匹配。
# requires_any（可选）：除关键词外，正文还须出现其中任一词，topic 才成立（用来压掉泛词误报）。
# authors: 命中直接置顶（HF blog 用 HF 用户名）。

# ---- 当前重点（2026-10）：Muse 级个人 agent、写代码操作电脑、办公 / 专业领域 agent 及其环境构建 ----
