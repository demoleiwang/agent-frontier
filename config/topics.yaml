             proactive, proactivity, long-term memory, agent memory, memory agent, personalization, personalized agent,
             user simulator, user preference, lifelong, digital life, everyday life, on-device agent, mobile agent,
             Grok Bot, Copilot Autopilot, Gemini Spark, OpenClaw, multi-day, living world]
