# 来源配置。enabled: false 的源暂不抓取，按阶段逐步打开。
# type:
#   github_blog_index  解析 GitHub 上的博客源码仓库（index yaml + 每篇 md frontmatter），信息最全
#   rss                标准 RSS/Atom
#   api / scrape       后续阶段实现

- id: hf-blog
  type: github_blog_index
  enabled: true
  repo: huggingface/blog
  branch: main
  index: _blog.yml
  url_template: https://huggingface.co/blog/{local}
  fallback:                      # GitHub 不可达时退回官方 RSS
    type: rss
    url: https://huggingface.co/blog/feed.xml
  tags: [hf-blog]

# ---- Lab blogs ----
# scrape: listing 页 + sitemap 发现链接，逐篇读文章页拿真实发布日期（sitemap 的 lastmod 不可信）
- id: anthropic-news
  type: scrape
  enabled: true
  listing_urls: [https://www.anthropic.com/news]
  sitemap: https://www.anthropic.com/sitemap.xml
  link_pattern: '^/news/[^/]+$'
  tags: [lab-blog, anthropic]

- id: anthropic-research
  type: scrape
  enabled: true
  listing_urls: [https://www.anthropic.com/research]
  sitemap: https://www.anthropic.com/sitemap.xml
  link_pattern: '^/research/(?!team/)[^/]+$'
  tags: [lab-blog, anthropic]

- id: anthropic-engineering
  type: scrape
  enabled: true
  listing_urls: [https://www.anthropic.com/engineering]
  sitemap: https://www.anthropic.com/sitemap.xml
  link_pattern: '^/engineering/[^/]+$'
  tags: [lab-blog, anthropic, agent-eng]

# ---- Lab feeds via GitHub mirror ----
# 官方站点在本云端环境被网络策略拦截；Olshansk/rss-feeds 每小时抓官方页面生成 RSS 并提交到 GitHub，
# raw.githubusercontent.com 可达。只有标题/日期/类别/短摘要，正文需另读（见 reviews/）。
# 在能直连的环境里可把 url 换回官方 RSS（openai.com/news/rss.xml 等）。
- &mirror
  id: openai-news
  type: rss
  enabled: true
  id_prefix: openai
  url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_openai_main.xml
  exclude_categories: [Startup, B2B Story]   # 客户案例
  tags: [lab-blog, openai]
- {<<: *mirror, id: openai-research, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_openai_research.xml}
- {<<: *mirror, id: openai-engineering, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_openai_engineering.xml}
- {<<: *mirror, id: openai-developer, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_openai_developer.xml}
- {<<: *mirror, id: google-developers-ai, id_prefix: google, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_google_ai.xml, exclude_categories: [], tags: [lab-blog, google]}
- {<<: *mirror, id: mistral-news, id_prefix: mistral, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_mistral.xml, exclude_categories: [], tags: [lab-blog, mistral]}
- {<<: *mirror, id: xai-news, id_prefix: xai, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_xainews.xml, exclude_categories: [], tags: [lab-blog, xai]}
- {<<: *mirror, id: meta-ai-blog, id_prefix: meta, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_meta_ai.xml, exclude_categories: [], tags: [lab-blog, meta]}   # 镜像 2026-07-27 后停更
- {<<: *mirror, id: anthropic-red, id_prefix: anthropic-red, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_red.xml, exclude_categories: [], tags: [lab-blog, anthropic]}
- {<<: *mirror, id: uk-aisi, id_prefix: aisi, url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_aisi.xml, exclude_categories: [], tags: [eval-org, aisi]}

# 无可用镜像（本环境不可达）：DeepMind blog、blog.google、Google Research、Thinking Machines、Qwen、DeepSeek 等。
# 官方 RSS 占位，在可直连环境（如 GitHub Actions）验证后打开。
- {id: deepmind-blog, type: rss, enabled: false, url: https://deepmind.google/blog/rss.xml, tags: [lab-blog, google]}
- {id: google-ai-keyword, type: rss, enabled: false, url: https://blog.google/technology/ai/rss/, tags: [lab-blog, google]}
- {id: google-research, type: rss, enabled: false, url: https://research.google/blog/rss/, tags: [lab-blog, google]}
- {id: thinking-machines, type: rss, enabled: false, url: https://thinkingmachines.ai/blog/index.xml, tags: [lab-blog, thinking-machines]}

# ---- Phase 2 ----
- id: hf-daily-papers
  type: api
  enabled: false
  url: https://huggingface.co/api/daily_papers
  filter: {min_upvotes: 30, min_upvotes_on_topic: 5}

- id: arxiv-agents
  type: api
  enabled: false
  query: '(cat:cs.AI OR cat:cs.CL OR cat:cs.LG) AND (abs:"computer use" OR abs:"web agent" OR abs:"GUI agent")'

